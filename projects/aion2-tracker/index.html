<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION 2 Progress Tracker</title>
<meta name="description" content="Daily and weekly to-do list, event and boss timers with browser alerts, and a gearing guide for AION 2.">
<style>
  /* Matches the parent site (imashapereraa.github.io): Bootstrap defaults, mint-white page, sage highlight */
  :root {
    --bg: #f8fff8;
    --panel: #ffffff;
    --line: #dee2e6;
    --text: #212529;
    --muted: #6c757d;
    --accent: #c0cfb2;
    --underline: #b0acba;
    --ok: #198754;
    --link: #000000;
    --on-accent: #212529;
    --hover-line: #adb5bd;
    --radius: 1em;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141814;
    --panel: #1c211c;
    --line: #2f362f;
    --text: #e4ebe4;
    --muted: #9aa59a;
    --accent: #c0cfb2;
    --underline: #6f6b7a;
    --ok: #6fcf97;
    --link: #e4ebe4;
    --on-accent: #1a1f17;
    --hover-line: #4a544a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif; }
  a { color: var(--link); text-decoration: underline; text-decoration-color: var(--underline); }
  a:hover { opacity: .5; }
  mark { background-color: var(--accent); color: var(--on-accent); padding: .1875em; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0; }
  .head-right { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .resets { display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .pill { background: var(--panel); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; }
  .pill b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; }
  button, select { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: .375rem; padding: 5px 12px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--hover-line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { opacity: .8; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  nav.tabs button { font-size: 16px; background: transparent; }
  nav.tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .section { margin-bottom: 14px; }
  .section > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section > summary::-webkit-details-marker { display: none; }
  h2 { font-size: 1.15rem; font-weight: 500; margin: 0; }
  .section > summary h2 { flex: 1 1 auto; }
  .section > summary .chev { transition: transform .2s; color: var(--muted); font-size: 12px; }
  .section[open] > summary .chev { transform: rotate(90deg); }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

  ul.tasks { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.tasks li { padding: 8px 4px; border-top: 1px solid var(--line); }
  ul.tasks li:first-child { border-top: none; }
  .txt small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  h3.sub { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 16px 0 0; }

  .timers-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .alert-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .timer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); }
  h3.sub + .timer { border-top: none; }
  .timer .name { flex: 1 1 200px; }
  .timer .name b { font-weight: 500; }
  .timer .name small { display: block; color: var(--muted); font-size: 13.5px; }
  .timer .left { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
  .timer .left.soon { color: var(--ok); }
  .timer .at { color: var(--muted); font-size: 14px; min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .bell[aria-pressed=false] { color: var(--muted); }

  .note { color: var(--muted); font-size: 13.5px; margin: 10px 0 0; }
  .hidden { display: none !important; }
</style>
<script>
  // Apply the saved theme (or the system preference) before the page paints.
  (function () {
    var t = null;
    try { t = localStorage.getItem("aion2-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>AION 2 <mark>Tracker</mark></h1>
    <div class="head-right">
      <div class="resets">
        <div class="pill">Daily reset in <b id="dailyIn">–</b></div>
        <div class="pill">Weekly reset in <b id="weeklyIn">–</b></div>
      </div>
      <button id="themeToggle" aria-label="Toggle dark theme"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="todo" aria-selected="true">To do</button>
    <button role="tab" data-tab="progression" aria-selected="false">Gearing</button>
  </nav>

  <main>
    <div id="tab-todo">
      <section class="card">
        <div class="timers-head">
          <h2>Timers</h2>
          <div class="alert-ctl">
            <button id="enableAlerts" class="primary">Enable browser alerts</button>
            <span id="alertStatus"></span>
            <label>Alert me <select id="lead">
              <option value="1">1 min</option>
              <option value="3">3 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
            </select> before</label>
          </div>
        </div>
        <div id="timers"></div>
      </section>
      <div id="lists"></div>
    </div>
    <div id="tab-progression" class="hidden"></div>
  </main>
</div>

<script>
/* ---------------- DATA ---------------- */
const PROGRESSION = [
  { id: "m1", title: "Level 45 → 1400", min: 0, max: 1400, items: [
    { id: "m1a", t: "Do side quests", n: "Daevanion Crystals, a full Pilgrim/Liberator set, 2 Clash Runes, plus skill points" },
    { id: "m1b", t: "Clear all Sealed Dungeons", n: "Daevanion Crystals and more skill points" },
    { id: "m1c", t: "Feathers → Revelation Amulet upgrades", n: "+10 green → unequip → Substance Morph to blue → +10 → morph to yellow, then stop" },
    { id: "m1d", t: "Strongholds → Noble Belt upgrades", n: "Same path as the Revelation Amulet" },
    { id: "m1e", t: "Weapon + Guard to +10" },
    { id: "m1f", t: "Blue gear to no more than +5, spread evenly", n: "Only push this when you're close to 1400" },
    { id: "m1g", t: "Clash Runes to +1 each" },
    { id: "m1h", t: "Exploration Draupnir" },
    { id: "m1i", t: "Spacetime Rift side quests + Sealed Dungeons", n: "Lots of enhancement stones" },
    { id: "m1j", t: "Manastone every piece of gear" },
  ], optional: [
    { id: "m1o1", t: "Shugo shop Daevanion Crystals" },
    { id: "m1o2", t: "Nightmare shop Daevanion Crystals" },
    { id: "m1o3", t: "Abyss Feathers", n: "Give PvP Daevanion Crystals" },
    { id: "m1o4", t: "Abyss Shop PvP Daevanion Crystals", n: "Only if you PvP a lot; Stigma Shards are better for progression" },
    { id: "m1o5", t: "World Boss Gartua when you can", n: "Spawns twice a day · 25% chance of 70 item level gear" },
    { id: "m1o6", t: "Bracelets to +10", n: "Won't be replaced until 2800+" },
  ]},
  { id: "m2", title: "1400 → 1600", min: 1400, max: 1600, items: [
    { id: "m2a", t: "Farm Urugugu Canyon", n: "Base item level 70 gear" },
    { id: "m2b", t: "Farm Vakron Sky Island for the other slots", n: "Base item level 70 gear" },
    { id: "m2c", t: "SAVE the Vakron Sky Island Exploration pity piece for later" },
    { id: "m2d", t: "Take unique 70 item level gear to +10" },
    { id: "m2e", t: "Manastone every new piece" },
    { id: "m2f", t: "Always take the Gear Change Voucher from Conquest pity chests", n: "Converts to any piece for a small fee, so you avoid duplicates" },
  ]},
  { id: "m3", title: "1600 → 2100", min: 1600, max: 2100, items: [
    { id: "m3a", t: "Keep farming Urugugu and Vakron" },
    { id: "m3b", t: "1600: Transcendence unlocked", n: "Grey and green Arcana" },
    { id: "m3c", t: "1900: Transcendence stage 2 unlocked", n: "Up to blue Arcana" },
    { id: "m3d", t: "Fill all 5 Arcana slots with at least green", n: "Blue in some slots if you need it" },
    { id: "m3e", t: "Claim the saved Vakron pity piece", n: "When it finishes your push to 2100, or it's the last piece you need" },
    { id: "m3f", t: "Pilgrim/Liberator gear to +10 if you need a small push past 2100" },
  ]},
  { id: "m4", title: "2100 → 2500 and beyond", min: 2100, max: 2500, items: [
    { id: "m4a", t: "Farm Ferocious Horn Den", n: "Base item level 86 gear" },
    { id: "m4b", t: "Farm Fire Temple for the other slots", n: "Base item level 86 gear" },
    { id: "m4c", t: "SAVE the Ferocious Horn Den Exploration pity piece for later" },
    { id: "m4d", t: "2200: Transcendence stage 3 unlocked", n: "Up to gold Arcana" },
    { id: "m4e", t: "Optional: a few stage 3 runs for gold cards", n: "2500 is reachable without them" },
    { id: "m4f", t: "Claim the saved Horn Den pity piece", n: "When it finishes your push to 2500, or it's the last piece you need" },
    { id: "m4g", t: "Theostones (and maybe intermediate manastones) on 86 base gear", n: "It will likely carry into the 2800 raid" },
    { id: "m4h", t: "Enhance gear above +10 once at or near 2500", n: "Pushing toward 2800" },
    { id: "m4i", t: "Gold Arcana in every slot; enhance the ones good for your class" },
    { id: "m4j", t: "Noble Belt + Revelation Amulet to +10 Yellow", n: "Expensive, so budget for it" },
  ]},
];

// scope: "char" = per character, "server" = shared across characters on a server
const DAILIES = [
  { id: "d1", t: "Duty Missions", c: 5, s: "server", n: "Journal → Duty · 50k Kinah + 1,000 AP each" },
  { id: "d2", t: "Nightmare attempts", c: 2, n: "Lowest uncleared tier · failures don't use an attempt · banks up to 14" },
  { id: "d3", t: "Spend Odyle Energy on cubes", n: "+15 every 3h · don't sit at the cap (560 / 840 with membership)" },
  { id: "d4", t: "Transcendence runs", c: 2, n: "Item level 1600+ · Deus Research Base / Shattered Arkanis" },
  { id: "d5", t: "Shugo Festival", c: 3, s: "server", n: "Every hour at :00" },
  { id: "d6", t: "Dimensional Invasion", c: 1, s: "server", n: "Every hour at :30" },
  { id: "d7", t: "Unknown Fissure (daily dungeon)", c: 2, s: "server", n: "14 per week, so 2 a day keeps pace" },
  { id: "d8", t: "Claim Attendance" },
  { id: "d9", t: "Spacetime Rift", opt: true, n: "Every 3h · extra AP after the weekly cap" },
  { id: "d10", t: "Check Black Cloud Merchant", opt: true, n: "Stock changes hourly" },
];

const WEEKLIES = [
  { group: "PvE", items: [
    { id: "w1", t: "Corroded Decontamination Facility", c: 2 },
    { id: "w2", t: "Chalice of Muspel", c: 2 },
    { id: "w3", t: "Ascension Trial", c: 3 },
    { id: "w4", t: "Subjugation (4-player)", c: 3 },
    { id: "w5", t: "Expedition Exploration reward counts", n: "7 per dungeon · Krao Cave and Urugugu Canyon cubes cost 20 Odyle Energy" },
    { id: "w6", t: "Silent Graveyard (7h)" },
    { id: "w7", t: "Fafnite Amphitheater (7h)" },
  ]},
  { group: "Abyss / PvP", items: [
    { id: "w8", t: "Chaotic Lower Reshanta (7h)" },
    { id: "w9", t: "Chaotic Middle Reshanta (7h)" },
    { id: "w10", t: "Upper Reshanta (7h)" },
    { id: "w11", t: "Battlefield wins", c: 3 },
    { id: "w12", t: "Abyss Commands", s: "server", n: "Up to 20 scrolls" },
  ]},
  { group: "Progression & shops", items: [
    { id: "w13", t: "Daeva Pass weekly EXP cap (50k)" },
    { id: "w14", t: "Season Mission points" },
    { id: "w15", t: "Command Missions", c: 12, s: "server" },
    { id: "w16", t: "Supply Requests", opt: true },
    { id: "w17", t: "Wind Breeze Merchant stock", opt: true, n: "Odyle Energy, dungeon items, Soul Crystals" },
  ]},
];

/* ---------------- TIME HELPERS ---------------- */
const RESET_H = 7; // UTC
function lastDailyReset(now = new Date()) {
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), RESET_H));
  if (now < d) d.setUTCDate(d.getUTCDate() - 1);
  return d;
}
function lastWeeklyReset(now = new Date()) {
  const d = lastDailyReset(now);
  while (d.getUTCDay() !== 3) d.setUTCDate(d.getUTCDate() - 1); // Wednesday
  return d;
}
function nextDailyReset(now = new Date()) { const d = lastDailyReset(now); d.setUTCDate(d.getUTCDate() + 1); return d; }
function nextWeeklyReset(now = new Date()) { const d = lastWeeklyReset(now); d.setUTCDate(d.getUTCDate() + 7); return d; }
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m`;
  return `${m}m ${s % 60}s`;
}
// Shown in Melbourne / Sydney time (AEST/AEDT)
const fmtAus = d => d.toLocaleString("en-AU", { timeZone: "Australia/Sydney", weekday: "short", hour: "numeric", minute: "2-digit", timeZoneName: "short" });

function nextHourly(min, now = new Date()) {
  const d = new Date(now); d.setUTCMinutes(min, 0, 0);
  if (d <= now) d.setUTCHours(d.getUTCHours() + 1);
  return d;
}
// Every `hours` hours, starting from `offsetH` o'clock UTC.
function nextEvery(hours, offsetH, now = new Date()) {
  const step = hours * 3600e3, off = offsetH * 3600e3;
  return new Date(Math.floor((+now - off) / step) * step + step + off);
}
// Given weekdays (0 = Sun) at a UTC time.
function nextWeekdays(days, h, m, now = new Date()) {
  for (let add = 0; add < 8; add++) {
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + add, h, m));
    if (d > now && days.includes(d.getUTCDay())) return d;
  }
}
const fmtClock = d => d.toLocaleString("en-AU", { timeZone: "Australia/Sydney", hour: "numeric", minute: "2-digit" });
const fmtWhen = (d, now) => d - now > 20 * 3600e3 ? fmtAus(d) : fmtClock(d);

// Abyss times are 21:00 / 21:30 server time (GMT+9) = 12:00 / 12:30 UTC.
const TIMERS = [
  { group: "Events", items: [
    { id: "shugo", name: "Shugo Festival", when: "Every hour at :00", next: now => nextHourly(0, now) },
    { id: "invasion", name: "Dimensional Invasion", when: "Every hour at :30", next: now => nextHourly(30, now) },
    { id: "rift", name: "Spacetime Rift", when: "Every 3 hours", next: now => nextEvery(3, 0, now) },
  ]},
  { group: "Abyss bosses", items: [
    { id: "kaira", name: "Watcher Kaira", when: "Chaotic Lower Reshanta · every 3 hours", next: now => nextEvery(3, 1, now) },
    { id: "nahma", name: "Guardian Lord Nahma", when: "Reshanta · Fri & Sun", next: now => nextWeekdays([5, 0], 12, 0, now) },
    { id: "executors", name: "Executors Argo, Kaira & Tamasa", when: "Reshanta · Mon, Thu & Sat", next: now => nextWeekdays([1, 4, 6], 12, 30, now) },
  ]},
];
const TIMER_LIST = TIMERS.flatMap(g => g.items);

/* ---------------- STATE ---------------- */
const KEY = "aion2-tracker-v2";
let state;
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  state = state || {};
  state.open = state.open || {};
  state.alerts = state.alerts || {};
  delete state.kills;
  TIMER_LIST.forEach(t => { if (state.alerts[t.id] === undefined) state.alerts[t.id] = true; });
  state.lead = [1, 3, 5, 10].includes(state.lead) ? state.lead : 5;
  if (state.tab !== "progression") state.tab = "todo";
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------------- RENDER ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

// To do items show just the task name; gearing keeps its notes.
const todoLi = item => taskLi({ t: item.t });

function taskLi(item) {
  return `<li><div class="txt">${esc(item.t)}${item.n ? `<small>${esc(item.n)}</small>` : ""}</div></li>`;
}

function sectionHtml(key, title, badgeHtml, body) {
  const open = state.open[key] !== undefined ? state.open[key] : true;
  return `<details class="card section" data-key="${key}" ${open ? "open" : ""}>
    <summary><span class="chev">▶</span><h2>${esc(title)}</h2>${badgeHtml || ""}</summary>${body}</details>`;
}

function renderProgression() {
  $("#tab-progression").innerHTML = PROGRESSION.map(sec => {
    let body = `<ul class="tasks">${sec.items.map(taskLi).join("")}</ul>`;
    if (sec.optional) body += `<h3 class="sub">Over time</h3><ul class="tasks">${sec.optional.map(taskLi).join("")}</ul>`;
    return sectionHtml("p-" + sec.id, sec.title, "", body);
  }).join("");
}

function renderLists() {
  $("#lists").innerHTML =
    sectionHtml("daily", "Daily", `<span class="badge">resets ${fmtAus(nextDailyReset())}</span>`,
      `<ul class="tasks">${DAILIES.map(todoLi).join("")}</ul>`) +
    WEEKLIES.map(g => sectionHtml("w-" + g.group, "Weekly: " + g.group, `<span class="badge">resets ${fmtAus(nextWeeklyReset())}</span>`,
      `<ul class="tasks">${g.items.map(todoLi).join("")}</ul>`)).join("");
}

const bellBtn = id => `<button class="bell" data-alert="${id}" aria-pressed="${!!state.alerts[id]}">${state.alerts[id] ? "🔔 Alert on" : "🔕 Alert off"}</button>`;
const timerRow = t => `<div class="timer">
    <div class="name"><b>${esc(t.name)}</b><small>${esc(t.when)}</small></div>
    <div class="at" id="at-${t.id}"></div>
    <div class="left" id="left-${t.id}"></div>
    ${bellBtn(t.id)}
  </div>`;

function renderTimers() {
  $("#timers").innerHTML = TIMERS.map(g => `<h3 class="sub">${esc(g.group)}</h3>` + g.items.map(timerRow).join("")).join("");
  updateTimers(new Date());
}

function updateTimers(now) {
  TIMER_LIST.forEach(t => {
    const next = t.next(now), ms = next - now, left = $("#left-" + t.id);
    $("#at-" + t.id).textContent = fmtWhen(next, now);
    left.textContent = fmtDur(ms);
    left.classList.toggle("soon", ms <= state.lead * 60000);
  });
}

/* ---------------- THEME ---------------- */
function renderThemeToggle() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const btn = $("#themeToggle");
  btn.textContent = dark ? "☀️ Light" : "🌙 Dark";
  btn.setAttribute("aria-pressed", dark);
}
$("#themeToggle").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("aion2-theme", next); } catch (e) {}
  renderThemeToggle();
});

/* ---------------- ALERTS ---------------- */
const canNotify = "Notification" in window;
function renderAlertStatus() {
  const btn = $("#enableAlerts"), status = $("#alertStatus");
  if (!canNotify) { btn.classList.add("hidden"); status.textContent = "This browser doesn't support alerts."; return; }
  const p = Notification.permission;
  btn.classList.toggle("hidden", p !== "default");
  status.textContent = p === "granted" ? "Alerts enabled." : p === "denied" ? "Alerts are blocked in your browser settings." : "";
}

function upcoming(now) {
  return TIMER_LIST.map(t => ({ id: t.id, name: t.name, next: t.next(now) }));
}

const fired = {};
function checkAlerts(now) {
  if (!canNotify || Notification.permission !== "granted") return;
  upcoming(now).forEach(x => {
    const ms = x.next - now;
    if (!state.alerts[x.id] || ms > state.lead * 60000 || fired[x.id] === +x.next) return;
    fired[x.id] = +x.next;
    const mins = Math.max(1, Math.round(ms / 60000));
    try { new Notification(`${x.name} in ${mins} min`, { body: `Starts at ${fmtClock(x.next)}`, tag: "aion2-" + x.id }); } catch (e) {}
  });
}
// Don't alert for anything already inside the window when the page opens or the lead time changes.
function primeAlerts(now) {
  upcoming(now).forEach(x => { if (x.next - now <= state.lead * 60000) fired[x.id] = +x.next; });
}

function renderAll() {
  renderLists(); renderProgression(); renderTimers(); renderAlertStatus(); renderThemeToggle();
  $("#lead").value = state.lead;
  showTab(state.tab);
  save();
}

function showTab(t) {
  state.tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.querySelectorAll("main > div").forEach(d => d.classList.toggle("hidden", d.id !== "tab-" + t));
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("nav.tabs button");
  if (tab) { showTab(tab.dataset.tab); save(); return; }
  const bell = e.target.closest("[data-alert]");
  if (bell) { state.alerts[bell.dataset.alert] = !state.alerts[bell.dataset.alert]; save(); renderTimers(); }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (d.matches && d.matches("details[data-key]")) { state.open[d.dataset.key] = d.open; save(); }
}, true);
$("#enableAlerts").addEventListener("click", async () => {
  try { await Notification.requestPermission(); } catch (e) {}
  renderAlertStatus();
  if (Notification.permission === "granted") new Notification("AION 2 alerts are on", { body: `You'll get a heads-up ${state.lead} min before each timer.` });
});
$("#lead").addEventListener("change", e => { state.lead = +e.target.value; save(); primeAlerts(new Date()); updateTimers(new Date()); });

let lastDaily = +nextDailyReset();
function tick() {
  const now = new Date();
  $("#dailyIn").textContent = fmtDur(nextDailyReset(now) - now);
  $("#weeklyIn").textContent = fmtDur(nextWeeklyReset(now) - now);
  updateTimers(now);
  checkAlerts(now);
  if (+nextDailyReset(now) !== lastDaily) { lastDaily = +nextDailyReset(now); renderLists(); }
}

load(); renderAll(); primeAlerts(new Date()); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
