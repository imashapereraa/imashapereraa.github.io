<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION 2 Progress Tracker</title>
<meta name="description" content="Character gearing progression, dailies, weeklies and event checklist for AION 2.">
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --line: #2a2f40;
    --text: #e6e8ef;
    --muted: #9097a8;
    --accent: #d9a441;
    --accent-2: #6aa8ff;
    --ok: #4fc38a;
    --warn: #e0794d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .resets { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pill { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
  .pill b { color: var(--text); font-variant-numeric: tabular-nums; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }

  .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #f0c86b); width: 0; transition: width .25s; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  nav.tabs button { background: transparent; border: 1px solid var(--line); }
  nav.tabs button[aria-selected=true] { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }

  .section { margin-bottom: 14px; }
  .section > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section > summary::-webkit-details-marker { display: none; }
  .section > summary h2 { font-size: 16px; margin: 0; flex: 1 1 auto; }
  .section > summary .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .section > summary .chev { transition: transform .2s; color: var(--muted); }
  .section[open] > summary .chev { transform: rotate(90deg); }
  .section .bar { margin-top: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.done { border-color: var(--ok); color: var(--ok); }
  .badge.server { border-color: #4a5a85; color: #9fb4ea; }
  .badge.ends { border-color: var(--warn); color: var(--warn); }

  ul.tasks { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-top: 1px solid var(--line); }
  ul.tasks li:first-child { border-top: none; }
  ul.tasks li.checked .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: #555; }
  ul.tasks input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .txt { flex: 1 1 auto; min-width: 0; }
  .txt small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .txt .tags { display: inline-flex; gap: 6px; margin-left: 6px; vertical-align: middle; flex-wrap: wrap; }
  .pips { display: flex; gap: 4px; flex-wrap: wrap; flex: none; max-width: 50%; justify-content: flex-end; }
  .pip { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); padding: 0; }
  .pip.on { background: var(--accent); border-color: var(--accent); }
  h3.sub { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 14px 0 0; }

  .note { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
  @media (max-width: 560px) {
    .pips { max-width: 45%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>AION 2 <span>Progress Tracker</span></h1>
    <div class="resets">
      <div class="pill">Daily reset in <b id="dailyIn">–</b></div>
      <div class="pill">Weekly reset in <b id="weeklyIn">–</b></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="progression" aria-selected="true">Gearing</button>
    <button role="tab" data-tab="todo" aria-selected="false">To do</button>
  </nav>

  <main>
    <div id="tab-progression"></div>
    <div id="tab-todo" class="hidden"></div>
  </main>
</div>

// scope: "char" = per character, "server" = shared across characters on a server
const DAILIES = [

  { id: "d2", t: "Nightmare attempts", c: 2, n: "Lowest uncleared tier · failures don't use an attempt · banks up to 14" },

  { id: "d5", t: "Shugo Festival", c: 3, s: "server", n: "Every hour at :00" },

const WEEKLIES = [
  { group: "PvE", items: [
    { id: "w1", t: "Corroded Decontamination Facility", c: 2 },
    { id: "w2", t: "Chalice of Muspel", c: 2 },
    { id: "w3", t: "Ascension Trial", c: 3 },
    { id: "w4", t: "Subjugation (4-player)", c: 3 },
    { id: "w5", t: "Expedition Exploration reward counts", n: "7 per dungeon · Krao Cave and Urugugu Canyon cubes cost 20 Odyle Energy" },
    { id: "w6", t: "Silent Graveyard (7h)" },
    { id: "w7", t: "Fafnite Amphitheater (7h)" },
  ]},
  { group: "Abyss / PvP", items: [

    { id: "w9", t: "Chaotic Middle Reshanta (7h)" },
    { id: "w10", t: "Upper Reshanta (7h)" },
    { id: "w11", t: "Battlefield wins", c: 3 },
    { id: "w12", t: "Abyss Commands", s: "server", n: "Up to 20 scrolls" },
  ]},
  { group: "Progression & shops", items: [
    { id: "w13", t: "Daeva Pass weekly EXP cap (50k)" },
    { id: "w14", t: "Season Mission points" },
    { id: "w15", t: "Command Missions", c: 12, s: "server" },
    { id: "w16", t: "Supply Requests", opt: true },
    { id: "w17", t: "Wind Breeze Merchant stock", opt: true, n: "Odyle Energy, dungeon items, Soul Crystals" },
  ]},
];

// end: ISO date when the event ends (hidden after). reset: "weekly" | "daily" | "once"
const EVENTS = [
  { id: "ev-hw", title: "Trick or Treat (Halloween)", end: "2026-11-04T00:00:00Z", endLabel: "Nov 4 maintenance", groups: [
    { name: "Weekly missions (Season Mission → Event tab)", s: "server", items: [
      { id: "hw1", t: "Log in 3 times", c: 3, r: "weekly", n: "30 coins" },
      { id: "hw2", t: "Hunt 10 Abyss monsters", r: "weekly", n: "25 coins" },
      { id: "hw3", t: "Clear Transcendence once", r: "weekly", n: "25 coins" },
      { id: "hw4", t: "Clear Expedition Conquest once", r: "weekly", n: "25 coins" },
      { id: "hw5", t: "Clear Ascension Trial once", r: "weekly", n: "25 coins" },
      { id: "hw6", t: "Clear Nightmare (any stage)", r: "weekly", n: "25 coins" },
      { id: "hw7", t: "Obtain 1 Unique gear", r: "weekly", n: "20 coins" },
      { id: "hw8", t: "Use 5 scrolls", r: "weekly", n: "20 coins" },
      { id: "hw9", t: "Dimensional Invasion", r: "weekly", n: "20 coins" },
      { id: "hw10", t: "Shugo Festival", r: "weekly", n: "20 coins" },
    ]},
    { name: "Candy Keys (60 fragments each · Substance Morph → Event)", s: "server", items: [
      { id: "hk1", t: "Blue key → open blue candy", r: "weekly", n: "4 Odyle Energy + Resurrection Spiritstones (best)" },
      { id: "hk2", t: "Yellow key → open yellow candy", r: "weekly", n: "10k Abyss Points + Life Crystals" },
      { id: "hk3", t: "Red key → open red candy", r: "weekly", n: "Growth Pet Chests + Battle Enhance Scrolls" },
    ]},
    { name: "Pumpkin Coin Trader (best purchases first)", s: "server", items: [
      { id: "hp1", t: "Special Halloween Chest (250)", r: "once", n: "Breastplate skin + 10k Pet Soul Crystals · one per server" },
      { id: "hp2", t: "Odyle Energy (10)", c: 4, r: "weekly" },
      { id: "hp3", t: "Nightmare Challenge Tickets (7)", c: 3, r: "weekly" },
      { id: "hp4", t: "Shugo Festival Reward Keys (7)", c: 3, r: "weekly" },
      { id: "hp5", t: "Lower Abyss Rift Stones (30)", c: 2, r: "weekly" },
      { id: "hp6", t: "Daily Dungeon instant clear tickets (3)", c: 7, r: "weekly" },

    ]},

    ]},
  ]},
  { id: "ev-coa", title: "Conquerors of the Abyss", end: "2026-10-28T00:00:00Z", endLabel: "Oct 28", groups: [
    { name: "Wind Breeze Merchant → Special", items: [
      { id: "ca1", t: "Abyss Rift Stones (Event)", c: 7, r: "weekly", n: "50k Kinah each · per level 45+ character" },
    ]},
  ]},
  { id: "ev-pc", title: "Planet's Call event pass", end: "2026-10-28T00:00:00Z", endLabel: "Oct 28", groups: [
    { name: "Weekly", items: [
      { id: "pc1", t: "Hit 15k weekly pass EXP", r: "weekly" },
    ]},
  ]},
];

/* ---------------- TIME HELPERS ---------------- */
const RESET_H = 7; // UTC
function lastDailyReset(now = new Date()) {
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), RESET_H));
  if (now < d) d.setUTCDate(d.getUTCDate() - 1);
  return d;
}
function lastWeeklyReset(now = new Date()) {
  const d = lastDailyReset(now);
  while (d.getUTCDay() !== 3) d.setUTCDate(d.getUTCDate() - 1); // Wednesday
  return d;
}
function nextDailyReset(now = new Date()) { const d = lastDailyReset(now); d.setUTCDate(d.getUTCDate() + 1); return d; }
function nextWeeklyReset(now = new Date()) { const d = lastWeeklyReset(now); d.setUTCDate(d.getUTCDate() + 7); return d; }
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m`;
  return `${m}m ${s % 60}s`;
}
// Shown in Melbourne / Sydney time (AEST/AEDT)
const fmtAus = d => d.toLocaleString("en-AU", { timeZone: "Australia/Sydney", weekday: "short", hour: "numeric", minute: "2-digit", timeZoneName: "short" });

/* ---------------- STATE ---------------- */
const KEY = "aion2-tracker-v1";
let state;
function load() {
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  // Older saves held a list of characters; keep the active one's progress.
  if (state && Array.isArray(state.chars)) {
    const c = state.chars.find(c => c.id === state.active) || state.chars[0] || {};
    state = { prog: c.prog, daily: c.daily, weekly: c.weekly, once: c.once, dStamp: c.dStamp, wStamp: c.wStamp, open: state.open };
  }
  state = state || {};
  ["prog", "daily", "weekly", "once", "open"].forEach(k => { state[k] = state[k] || {}; });
  if (state.tab !== "todo") state.tab = "progression";
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function applyResets() {
  const ld = +lastDailyReset(), lw = +lastWeeklyReset();
  if ((state.dStamp || 0) < ld) { state.daily = {}; state.dStamp = ld; }
  if ((state.wStamp || 0) < lw) { state.weekly = {}; state.wStamp = lw; }
}

/* ---------------- RENDER ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function store(kind) { return state[kind]; }
function val(kind, id) { return store(kind)[id] || 0; }
function isDone(kind, item) { const v = val(kind, item.id); return item.c ? v >= item.c : !!v; }

function taskLi(kind, item) {
  const done = isDone(kind, item), v = val(kind, item.id);
  const tags = [];
  if (item.s === "server") tags.push('<span class="badge server">server-wide</span>');
  if (item.opt) tags.push('<span class="badge">optional</span>');
  let control;
  if (item.c && item.c > 1) {
    control = `<div class="pips" data-kind="${kind}" data-id="${item.id}" data-c="${item.c}">` +
      Array.from({ length: item.c }, (_, i) => `<button class="pip${i < v ? " on" : ""}" data-i="${i + 1}" aria-label="${i + 1} of ${item.c}"></button>`).join("") + `</div>`;
  } else control = "";
  return `<li class="${done ? "checked" : ""}">
    <input type="checkbox" ${done ? "checked" : ""} data-kind="${kind}" data-id="${item.id}" data-c="${item.c || 1}" aria-label="${esc(item.t)}">
    <div class="txt">${esc(item.t)}${item.c > 1 ? ` <span class="note">(${v}/${item.c})</span>` : ""}<span class="tags">${tags.join("")}</span>${item.n ? `<small>${esc(item.n)}</small>` : ""}</div>
    ${control}</li>`;
}

function countDone(kind, items, skipOpt) {
  const list = skipOpt ? items.filter(i => !i.opt) : items;
  return [list.filter(i => isDone(kind, i)).length, list.length];
}

function sectionHtml(key, title, badgeHtml, body, done, total) {
  const open = state.open[key] !== undefined ? state.open[key] : true;
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<details class="card section" data-key="${key}" ${open ? "open" : ""}>
    <summary><span class="chev">▶</span><h2>${esc(title)}</h2>${badgeHtml || ""}<span class="count">${done}/${total}</span></summary>
    <div class="bar"><i style="width:${pct}%"></i></div>${body}</details>`;
}

function renderProgression() {
  $("#tab-progression").innerHTML = PROGRESSION.map(sec => {
    const all = sec.items.concat(sec.optional || []);
    const [d, t] = countDone("prog", all);
    const badge = d === t ? '<span class="badge done">complete</span>' : "";
    let body = `<ul class="tasks">${sec.items.map(i => taskLi("prog", i)).join("")}</ul>`;
    if (sec.optional) body += `<h3 class="sub">Optional / over time</h3><ul class="tasks">${sec.optional.map(i => taskLi("prog", i)).join("")}</ul>`;
    return sectionHtml("p-" + sec.id, sec.title, badge, body, d, t);
  }).join("");
}

function kindOf(item) { return item.r === "once" ? "once" : item.r === "daily" ? "daily" : "weekly"; }

function renderTodo() {
  const [dd, dt] = countDone("daily", DAILIES, true);
  let html = sectionHtml("daily", "Daily", `<span class="badge">resets ${fmtAus(nextDailyReset())}</span>`,
    `<ul class="tasks">${DAILIES.map(i => taskLi("daily", i)).join("")}</ul>`, dd, dt);
  html += WEEKLIES.map(g => {
    const [d, t] = countDone("weekly", g.items, true);
    return sectionHtml("w-" + g.group, "Weekly: " + g.group, `<span class="badge">resets ${fmtAus(nextWeeklyReset())}</span>`,
      `<ul class="tasks">${g.items.map(i => taskLi("weekly", i)).join("")}</ul>`, d, t);
  }).join("");
  const now = new Date();
  html += EVENTS.filter(e => new Date(e.end) > now).map(e => {
    const all = e.groups.flatMap(g => g.items);
    let d = 0; all.forEach(i => { if (isDone(kindOf(i), i)) d++; });
    const body = e.groups.map(g => `<h3 class="sub">${esc(g.name)}${g.s === "server" ? ' <span class="badge server">server-wide</span>' : ""}</h3>
      <ul class="tasks">${g.items.map(i => taskLi(kindOf(i), i)).join("")}</ul>`).join("");
    const left = fmtDur(new Date(e.end) - now);
    return sectionHtml("e-" + e.id, "Event: " + e.title, `<span class="badge ends">ends ${esc(e.endLabel)} · ${left}</span>`, body, d, all.length);
  }).join("");
  $("#tab-todo").innerHTML = html;
}

function renderAll() {
  applyResets();
  renderProgression(); renderTodo();
  showTab(state.tab);
  save();
}

function showTab(t) {
  state.tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.querySelectorAll("main > div").forEach(d => d.classList.toggle("hidden", d.id !== "tab-" + t));
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("change", e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-kind]')) {
    const s = store(el.dataset.kind), c = +el.dataset.c;
    if (el.checked) s[el.dataset.id] = c > 1 ? c : 1; else delete s[el.dataset.id];
    renderAll();
  }
});
document.addEventListener("click", e => {
  const pip = e.target.closest(".pip");
  if (pip) {
    const box = pip.parentElement, s = store(box.dataset.kind), id = box.dataset.id, i = +pip.dataset.i;
    s[id] = (s[id] || 0) === i ? i - 1 : i;
    if (!s[id]) delete s[id];
    renderAll(); return;
  }
  const tab = e.target.closest("nav.tabs button");
  if (tab) { showTab(tab.dataset.tab); save(); }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (d.matches && d.matches("details[data-key]")) { state.open[d.dataset.key] = d.open; save(); }
}, true);

function tick() {
  const now = new Date();
  $("#dailyIn").textContent = fmtDur(nextDailyReset(now) - now);
  $("#weeklyIn").textContent = fmtDur(nextWeeklyReset(now) - now);
  if ((state.dStamp || 0) < +lastDailyReset(now) || (state.wStamp || 0) < +lastWeeklyReset(now)) renderAll();
}

load(); renderAll(); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
