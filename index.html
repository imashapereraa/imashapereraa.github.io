<!doctype html>
<html lang="en">
  <head>
        <script>
          // GitHub Pages SPA redirect: restore the original path from /?p=... (set by 404.html)
          (function () {
            var params = new URLSearchParams(window.location.search);
            var p = params.get('p');
            var q = params.get('q');
            if (p) {
              var decodedPath = decodeURIComponent(p);
              var decodedQuery = q ? decodeURIComponent(q) : '';
              // Keep origin, replace the URL in-place, then let the SPA router handle it.
              window.history.replaceState(null, '', decodedPath + (decodedQuery || '') + window.location.hash);
            }
          })();
        </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lemon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imasha's Corner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
